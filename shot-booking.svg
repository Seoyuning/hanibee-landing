<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2a4e"/>
      <stop offset="100%" stop-color="#1a3d6b"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg3)"/>

  <text x="540" y="230" text-anchor="middle" font-size="82" font-weight="900" fill="white" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">3분 만에</text>
  <text x="540" y="340" text-anchor="middle" font-size="82" font-weight="900" fill="#e8c368" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">예약 완료</text>
  <text x="540" y="420" text-anchor="middle" font-size="36" fill="#d0d8e6" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">부모님 대신 예약도 쉽게</text>

  <!-- Phone frame -->
  <rect x="240" y="500" width="600" height="1240" rx="70" ry="70" fill="#1a1a1a" stroke="#d4a93d" stroke-width="6"/>
  <rect x="265" y="525" width="550" height="1190" rx="50" ry="50" fill="white"/>

  <rect x="460" y="525" width="160" height="32" rx="16" ry="16" fill="#1a1a1a"/>

  <!-- App header -->
  <rect x="265" y="560" width="550" height="100" fill="#0f2a4e"/>
  <text x="540" y="625" text-anchor="middle" font-size="32" font-weight="700" fill="white" font-family="sans-serif">예약하기</text>

  <!-- Progress steps -->
  <circle cx="310" cy="720" r="24" fill="#d4a93d"/>
  <text x="310" y="729" text-anchor="middle" font-size="22" fill="white" font-weight="700" font-family="sans-serif">✓</text>
  <line x1="334" y1="720" x2="398" y2="720" stroke="#d4a93d" stroke-width="4"/>

  <circle cx="422" cy="720" r="24" fill="#d4a93d"/>
  <text x="422" y="729" text-anchor="middle" font-size="22" fill="white" font-weight="700" font-family="sans-serif">✓</text>
  <line x1="446" y1="720" x2="510" y2="720" stroke="#d4a93d" stroke-width="4"/>

  <circle cx="534" cy="720" r="24" fill="#d4a93d"/>
  <text x="534" y="729" text-anchor="middle" font-size="22" fill="white" font-weight="700" font-family="sans-serif">3</text>
  <line x1="558" y1="720" x2="622" y2="720" stroke="#ddd" stroke-width="4"/>

  <circle cx="646" cy="720" r="24" fill="#ddd"/>
  <text x="646" y="729" text-anchor="middle" font-size="22" fill="#888" font-family="sans-serif">4</text>
  <line x1="670" y1="720" x2="734" y2="720" stroke="#ddd" stroke-width="4"/>

  <circle cx="758" cy="720" r="24" fill="#ddd"/>
  <text x="758" y="729" text-anchor="middle" font-size="22" fill="#888" font-family="sans-serif">5</text>

  <text x="540" y="800" text-anchor="middle" font-size="32" font-weight="800" fill="#0f2a4e" font-family="sans-serif">날짜를 선택하세요</text>

  <!-- Calendar mini -->
  <rect x="305" y="850" width="470" height="440" rx="16" ry="16" fill="#fafafa" stroke="#e5e5e5" stroke-width="2"/>

  <text x="540" y="895" text-anchor="middle" font-size="24" font-weight="700" fill="#0f2a4e" font-family="sans-serif">2026년 4월</text>

  <!-- Weekday labels -->
  <text x="352" y="940" text-anchor="middle" font-size="20" fill="#888" font-family="sans-serif">월</text>
  <text x="415" y="940" text-anchor="middle" font-size="20" fill="#888" font-family="sans-serif">화</text>
  <text x="478" y="940" text-anchor="middle" font-size="20" fill="#888" font-family="sans-serif">수</text>
  <text x="541" y="940" text-anchor="middle" font-size="20" fill="#888" font-family="sans-serif">목</text>
  <text x="604" y="940" text-anchor="middle" font-size="20" fill="#888" font-family="sans-serif">금</text>
  <text x="667" y="940" text-anchor="middle" font-size="20" fill="#e55555" font-family="sans-serif">토</text>
  <text x="730" y="940" text-anchor="middle" font-size="20" fill="#e55555" font-family="sans-serif">일</text>

  <!-- Date grid (4 weeks) -->
  <g font-size="22" fill="#333" font-family="sans-serif">
    <text x="352" y="990" text-anchor="middle">1</text>
    <text x="415" y="990" text-anchor="middle">2</text>
    <text x="478" y="990" text-anchor="middle">3</text>
    <text x="541" y="990" text-anchor="middle">4</text>
    <text x="604" y="990" text-anchor="middle">5</text>
    <text x="667" y="990" text-anchor="middle" fill="#e55555">6</text>
    <text x="730" y="990" text-anchor="middle" fill="#e55555">7</text>

    <text x="352" y="1050" text-anchor="middle">8</text>
    <text x="415" y="1050" text-anchor="middle">9</text>
    <text x="478" y="1050" text-anchor="middle">10</text>
    <text x="541" y="1050" text-anchor="middle">11</text>
    <text x="604" y="1050" text-anchor="middle">12</text>
    <text x="667" y="1050" text-anchor="middle" fill="#e55555">13</text>
    <text x="730" y="1050" text-anchor="middle" fill="#e55555">14</text>

    <!-- Selected date -->
    <circle cx="415" cy="1105" r="28" fill="#d4a93d"/>
    <text x="415" y="1113" text-anchor="middle" fill="white" font-weight="700">16</text>
    <text x="352" y="1113" text-anchor="middle">15</text>
    <text x="478" y="1113" text-anchor="middle">17</text>
    <text x="541" y="1113" text-anchor="middle">18</text>
    <text x="604" y="1113" text-anchor="middle">19</text>
    <text x="667" y="1113" text-anchor="middle" fill="#e55555">20</text>
    <text x="730" y="1113" text-anchor="middle" fill="#e55555">21</text>

    <text x="352" y="1173" text-anchor="middle">22</text>
    <text x="415" y="1173" text-anchor="middle">23</text>
    <text x="478" y="1173" text-anchor="middle">24</text>
    <text x="541" y="1173" text-anchor="middle">25</text>
    <text x="604" y="1173" text-anchor="middle">26</text>
    <text x="667" y="1173" text-anchor="middle" fill="#e55555">27</text>
    <text x="730" y="1173" text-anchor="middle" fill="#e55555">28</text>

    <text x="352" y="1233" text-anchor="middle">29</text>
    <text x="415" y="1233" text-anchor="middle">30</text>
  </g>

  <!-- Time slot chips -->
  <text x="305" y="1340" font-size="24" font-weight="700" fill="#0f2a4e" font-family="sans-serif">시간 선택</text>
  <rect x="305" y="1370" width="140" height="60" rx="30" ry="30" fill="#f5f1e8" stroke="#d4a93d" stroke-width="2"/>
  <text x="375" y="1410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f2a4e" font-family="sans-serif">10:00</text>

  <rect x="460" y="1370" width="140" height="60" rx="30" ry="30" fill="#d4a93d"/>
  <text x="530" y="1410" text-anchor="middle" font-size="22" font-weight="700" fill="white" font-family="sans-serif">10:30</text>

  <rect x="615" y="1370" width="140" height="60" rx="30" ry="30" fill="#f5f1e8" stroke="#d4a93d" stroke-width="2"/>
  <text x="685" y="1410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f2a4e" font-family="sans-serif">11:00</text>

  <!-- Book button -->
  <rect x="305" y="1570" width="470" height="90" rx="45" ry="45" fill="#d4a93d"/>
  <text x="540" y="1625" text-anchor="middle" font-size="32" font-weight="800" fill="white" font-family="sans-serif">다음 단계로</text>

  <text x="540" y="1860" text-anchor="middle" font-size="34" fill="#d4a93d" font-weight="700" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">6단계 차근차근 안내 받으며 예약</text>
</svg>
