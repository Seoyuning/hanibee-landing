  <rect x="56" y="760" width="78" height="78" rx="20" fill="#FCEFD2"/><text x="95" y="818" font-size="40" text-anchor="middle">👨‍⚕️</text>
  <rect x="150" y="760" width="700" height="200" rx="28" fill="#fff"/>
  <text x="186" y="820" font-size="30" fill="#2A2622">방문해서 침구 치료와 함께</text>
