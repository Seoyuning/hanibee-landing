<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2a4e"/>
      <stop offset="100%" stop-color="#1a3d6b"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg4)"/>

  <text x="540" y="230" text-anchor="middle" font-size="82" font-weight="900" fill="white" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">한의사와</text>
  <text x="540" y="340" text-anchor="middle" font-size="82" font-weight="900" fill="#e8c368" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">실시간 상담</text>
  <text x="540" y="420" text-anchor="middle" font-size="36" fill="#d0d8e6" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">진료 전후 궁금증을 바로 해결</text>

  <!-- Phone frame -->
  <rect x="240" y="500" width="600" height="1240" rx="70" ry="70" fill="#1a1a1a" stroke="#d4a93d" stroke-width="6"/>
  <rect x="265" y="525" width="550" height="1190" rx="50" ry="50" fill="#f5f1e8"/>

  <rect x="460" y="525" width="160" height="32" rx="16" ry="16" fill="#1a1a1a"/>

  <!-- Chat header -->
  <rect x="265" y="560" width="550" height="130" fill="#0f2a4e"/>
  <circle cx="345" cy="625" r="36" fill="white"/>
  <text x="345" y="638" text-anchor="middle" font-size="36" font-family="sans-serif">👨‍⚕️</text>
  <text x="400" y="615" font-size="28" font-weight="700" fill="white" font-family="sans-serif">김한의 한의사</text>
  <text x="400" y="655" font-size="20" fill="#a0b0c8" font-family="sans-serif">다음 진료: 4/16 (화) 10:30</text>

  <!-- Date separator -->
  <rect x="430" y="720" width="220" height="38" rx="19" ry="19" fill="white" opacity="0.8"/>
  <text x="540" y="745" text-anchor="middle" font-size="20" fill="#666" font-family="sans-serif">2026년 4월 15일</text>

  <!-- Patient message -->
  <rect x="350" y="790" width="420" height="110" rx="22" ry="22" fill="#d4a93d"/>
  <text x="380" y="835" font-size="24" fill="white" font-family="sans-serif">안녕하세요 선생님,</text>
  <text x="380" y="875" font-size="24" fill="white" font-family="sans-serif">요즘 허리가 너무 아픈데</text>
  <text x="380" y="895" font-size="20" fill="#f5f1e8" font-family="sans-serif">오후 3:42  ✓✓</text>

  <!-- Doctor message -->
  <circle cx="300" cy="970" r="28" fill="white"/>
  <text x="300" y="980" text-anchor="middle" font-size="28" font-family="sans-serif">👨‍⚕️</text>

  <rect x="345" y="950" width="420" height="180" rx="22" ry="22" fill="white"/>
  <text x="375" y="995" font-size="24" fill="#0f2a4e" font-family="sans-serif">네, 안녕하세요!</text>
  <text x="375" y="1035" font-size="24" fill="#0f2a4e" font-family="sans-serif">통증이 있으신 위치와</text>
  <text x="375" y="1075" font-size="24" fill="#0f2a4e" font-family="sans-serif">언제부터인지 알려주세요.</text>
  <text x="375" y="1110" font-size="20" fill="#888" font-family="sans-serif">오후 3:44</text>

  <!-- Patient message 2 -->
  <rect x="350" y="1160" width="420" height="150" rx="22" ry="22" fill="#d4a93d"/>
  <text x="380" y="1205" font-size="24" fill="white" font-family="sans-serif">하부 허리쪽이 아프고,</text>
  <text x="380" y="1245" font-size="24" fill="white" font-family="sans-serif">3일 전부터 시작됐어요.</text>
  <text x="380" y="1280" font-size="20" fill="#f5f1e8" font-family="sans-serif">오후 3:46  ✓✓</text>

  <!-- Doctor typing -->
  <rect x="345" y="1350" width="200" height="70" rx="22" ry="22" fill="white"/>
  <circle cx="400" cy="1385" r="8" fill="#999"/>
  <circle cx="430" cy="1385" r="8" fill="#bbb"/>
  <circle cx="460" cy="1385" r="8" fill="#ddd"/>
  <text x="510" y="1395" font-size="20" fill="#888" font-family="sans-serif">입력 중...</text>

  <!-- Quick reply templates -->
  <rect x="265" y="1460" width="550" height="70" fill="#ede6d4"/>
  <rect x="285" y="1475" width="180" height="40" rx="20" ry="20" fill="white" stroke="#d4a93d" stroke-width="1"/>
  <text x="375" y="1502" text-anchor="middle" font-size="18" fill="#0f2a4e" font-family="sans-serif">네, 알겠습니다</text>

  <rect x="475" y="1475" width="180" height="40" rx="20" ry="20" fill="white" stroke="#d4a93d" stroke-width="1"/>
  <text x="565" y="1502" text-anchor="middle" font-size="18" fill="#0f2a4e" font-family="sans-serif">예약 확인 부탁</text>

  <!-- Chat input area -->
  <rect x="265" y="1540" width="550" height="120" fill="white"/>
  <rect x="295" y="1565" width="410" height="70" rx="35" ry="35" fill="#f0f0f0"/>
  <text x="320" y="1610" font-size="22" fill="#888" font-family="sans-serif">메시지를 입력하세요</text>

  <circle cx="750" cy="1600" r="32" fill="#d4a93d"/>
  <text x="750" y="1612" text-anchor="middle" font-size="26" fill="white" font-family="sans-serif">↑</text>

  <text x="540" y="1860" text-anchor="middle" font-size="34" fill="#d4a93d" font-weight="700" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">읽음 표시와 실시간 알림</text>
</svg>
