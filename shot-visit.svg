<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect width="1080" height="1920" fill="#FAFAF7"/>

  <!-- 상태바 -->
