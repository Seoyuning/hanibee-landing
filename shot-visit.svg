  <rect x="80" y="1362" width="136" height="136" rx="26" fill="#FCEFD2"/><text x="148" y="1452" font-size="68" text-anchor="middle">👨‍⚕️</text>
  <text x="248" y="1408" font-size="34" font-weight="700" fill="#2A2622">김한결 한의사</text>
  <text x="248" y="1454" font-size="27" fill="#6B7A70">한결한의원</text>
  <rect x="740" y="1362" width="136" height="136" rx="22" fill="#E6ECE3"/><text x="808" y="1452" font-size="60" text-anchor="middle">📷</text>
