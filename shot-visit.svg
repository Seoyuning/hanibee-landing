  <g fill="#2A2622"><rect x="900" y="38" width="34" height="20" rx="3"/><rect x="946" y="32" width="30" height="26" rx="4"/><rect x="986" y="30" width="46" height="22" rx="6"/></g>

  <!-- 헤더 -->
