    <circle cx="130" cy="1020" r="22" fill="#234434"/><text x="180" y="1015" font-weight="700" fill="#2A2622">도착</text><text x="990" y="1015" font-size="25" fill="#9AA89F" text-anchor="end">10:58</text>
    <circle cx="130" cy="1090" r="26" fill="#234434" stroke="#C7E0D0" stroke-width="10"/><text x="195" y="1085" font-weight="800" fill="#234434">진료 중</text>
    <circle cx="130" cy="1210" r="22" fill="#fff" stroke="#D8D6CC" stroke-width="6"/><text x="180" y="1205" fill="#9AA89F">진료 종료</text>
