<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect width="1080" height="1920" fill="#FAFAF7"/>

  <!-- 상태바 -->
  <text x="64" y="62" font-size="32" font-weight="700" fill="#2A2622">9:41</text>
  <g fill="#2A2622"><rect x="900" y="38" width="34" height="20" rx="3"/><rect x="946" y="32" width="30" height="26" rx="4"/><rect x="986" y="30" width="46" height="22" rx="6"/></g>

  <!-- 헤더 -->
  <text x="64" y="158" font-size="46" font-weight="800" fill="#234434">방문 진행 상황</text>

