  <rect x="48" y="240" width="984" height="140" rx="24" fill="#234434"/>
  <text x="84" y="298" font-size="27" fill="#A9C3B3" font-weight="700">현재 상태</text>
  <text x="84" y="346" font-size="36" fill="#fff" font-weight="800">한의사가 도착했어요 · 진료 시작</text>

  <!-- 진행 타임라인 -->
  <rect x="48" y="450" width="984" height="680" rx="32" fill="#fff" stroke="#ECEAE2" stroke-width="2"/>
  <!-- 라인 -->
  <line x1="130" y1="560" x2="130" y2="980" stroke="#E3E1D8" stroke-width="6"/>
  <line x1="130" y1="560" x2="130" y2="820" stroke="#234434" stroke-width="6"/>
  <!-- 단계들 -->
  <g font-size="32">
    <circle cx="130" cy="560" r="22" fill="#234434"/><text x="180" y="555" font-weight="700" fill="#2A2622">출발</text><text x="990" y="555" font-size="25" fill="#9AA89F" text-anchor="end">10:32</text>
    <circle cx="130" cy="690" r="22" fill="#234434"/><text x="180" y="685" font-weight="700" fill="#2A2622">도착</text><text x="990" y="685" font-size="25" fill="#9AA89F" text-anchor="end">10:58</text>
    <circle cx="130" cy="820" r="26" fill="#234434" stroke="#C7E0D0" stroke-width="10"/><text x="195" y="815" font-weight="800" fill="#234434">진료 중</text>
    <circle cx="130" cy="980" r="22" fill="#fff" stroke="#D8D6CC" stroke-width="6"/><text x="180" y="975" fill="#9AA89F">진료 종료</text>
  </g>

  <!-- 한의사 정보 + 도착 사진 -->
  <rect x="48" y="1200" width="984" height="200" rx="28" fill="#fff" stroke="#ECEAE2" stroke-width="2"/>
  <rect x="80" y="1232" width="136" height="136" rx="26" fill="#FCEFD2"/><text x="148" y="1322" font-size="68" text-anchor="middle">👨‍⚕️</text>
  <text x="248" y="1278" font-size="34" font-weight="700" fill="#2A2622">김한결 한의사</text>
  <text x="248" y="1324" font-size="27" fill="#6B7A70">한결한의원</text>
  <rect x="740" y="1232" width="136" height="136" rx="22" fill="#E6ECE3"/><text x="808" y="1322" font-size="60" text-anchor="middle">📷</text>
  <text x="896" y="1278" font-size="24" fill="#B08A3E" font-weight="700">도착 사진</text>
  <text x="896" y="1318" font-size="22" fill="#9AA89F">10:58 기록</text>

  <!-- 하단 네비 -->
  <rect x="0" y="1772" width="1080" height="148" fill="#fff"/>
  <rect x="0" y="1772" width="1080" height="2" fill="#ECEAE2"/>
  <g text-anchor="middle">
    <text x="108" y="1838" font-size="44">🏠</text><text x="108" y="1882" font-size="22" font-weight="700" fill="#234434">홈</text>
    <text x="324" y="1838" font-size="44">📍</text><text x="324" y="1882" font-size="22" fill="#9AA89F">찾기</text>
    <text x="540" y="1838" font-size="44">🗓️</text><text x="540" y="1882" font-size="22" fill="#9AA89F">예약</text>
    <text x="756" y="1838" font-size="44">💬</text><text x="756" y="1882" font-size="22" fill="#9AA89F">채팅</text>
    <text x="972" y="1838" font-size="44">🐝</text><text x="972" y="1882" font-size="22" fill="#9AA89F">내 정보</text>
